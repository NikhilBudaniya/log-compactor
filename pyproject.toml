[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-compactor"
version = "0.2.0"
description = "Deduplicate and compact structured logs in real time: YAML config, regex or key=value parsing, Unix pipes, CLI (logcompact)."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Nikhil Budaniya" },
]
keywords = [
    "logging",
    "logs",
    "log-compactor",
    "deduplication",
    "dedupe",
    "compaction",
    "compress-logs",
    "cli",
    "command-line",
    "pipe",
    "stdin",
    "stdout",
    "unix",
    "terminal",
    "structured-logging",
    "regex",
    "yaml",
    "config",
    "observability",
    "devops",
    "syslog",
    "pydantic",
    "click",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://pypi.org/project/log-compactor/"
Documentation = "https://github.com/NikhilBudaniya/log-compactor#readme"
Repository = "https://github.com/NikhilBudaniya/log-compactor"
Issues = "https://github.com/NikhilBudaniya/log-compactor/issues"
Changelog = "https://github.com/NikhilBudaniya/log-compactor/blob/main/CHANGELOG.md"

[project.scripts]
logcompact = "compactor.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]